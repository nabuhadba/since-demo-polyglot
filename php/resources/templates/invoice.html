<article class="invoice">
  <h1>Invoice {{number}}</h1>
  <p class="customer">{{customer}}</p>
  <table>
    <tr><th>Subtotal</th><td>{{subtotal}}</td></tr>
    <tr><th>Tax</th><td>{{tax}}</td></tr>
    <tr><th>Total</th><td>{{total}}</td></tr>
  </table>
  <section class="notes">{{notes}}</section>
</article>
