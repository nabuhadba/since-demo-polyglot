name: php

on:
  pull_request:
    paths:
      - "php/**"
      - ".github/workflows/php.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
