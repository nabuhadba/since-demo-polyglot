name: swift

on:
  pull_request:
    paths:
      - "swift/tracking-server/**"
      - ".github/workflows/swift.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: swift/tracking-server
    steps:
      - uses: actions/checkout@v5
      - run: swift build
      - run: swift test
